<body class="dg">
<!-- Проверка, что именно не уходит с телефона в Forminit. Каждый запрос несёт
     заведомо неверное поле (fi-sender-name): сервер принимает тело, отвечает
     400 и ничего не сохраняет — ни во входящие, ни в квоту. -->
<main class="dg-main">
  <h1 class="bf-h">Проверка отправки</h1>
  <p class="bf-text">Страница отправит в Forminit несколько тестовых пакетов и ваши записи из брифа. Сервер их отклонит и ничего не сохранит — нужно только понять, доходят ли они. Займёт около минуты.</p>
  <div class="bf-actions"><button class="bf-btn" id="run" type="button">Начать проверку</button></div>
  <ol class="dg-list" id="list"></ol>
  <p class="bf-label dg-env" id="env"></p>
</main>
<script src="diag.js?v=1"></script>
