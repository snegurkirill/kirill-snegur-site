<body class="dg">
<!-- Проверка, доходят ли с телефона пакеты до сервера брифа. По умолчанию —
     свой обработчик (brief.snegur.space, diag=1: тело выбрасывается), с
     ?target=forminit — Forminit с заведомо неверным полем (400, ничего не
     сохраняется). -->
<main class="dg-main">
  <h1 class="bf-h">Проверка отправки</h1>
  <p class="bf-text">Страница отправит на сервер брифа несколько тестовых пакетов и ваши записи. Сервер их не сохранит — нужно только понять, доходят ли они. Займёт около минуты.</p>
  <div class="bf-actions"><button class="bf-btn" id="run" type="button">Начать проверку</button></div>
  <ol class="dg-list" id="list"></ol>
  <p class="bf-label dg-env" id="env"></p>
</main>
<script src="diag.js?v=3"></script>
</body>
