<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
<title>Экономика океана — бриф о витрине</title>
<meta name="description" content="Бриф к проекту «Витрина индустрии» для АНО «Экономика океана».">
<meta name="theme-color" content="#ffffff">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="strict-origin-when-cross-origin">
<link rel="stylesheet" href="../styles.css">
<link rel="stylesheet" href="../ds.css?v=8">
<link rel="stylesheet" href="brief.css?v=6">
</head>
<body class="bf-body">
<div class="bf" id="app">
  <div class="bf-progress" aria-hidden="true"><i id="progress"></i></div>

  <header class="bf-top">
    <p class="bf-brand">Экономика океана<span class="bf-brand__more"> • Бриф о витрине</span></p>
    <p class="bf-test" id="test-mode" hidden>Тестовый режим: ответы не отправляются</p>
  </header>

  <main class="bf-stage" id="stage" aria-live="polite"></main>

  <!-- Список всех вопросов: зелёный — есть ответ, чёрный — ещё нет. -->
  <nav class="bf-menu" id="menu" aria-label="Все вопросы" hidden>
    <div class="bf-menu__list" id="menu-list"></div>
  </nav>

  <button class="bf-menu-btn" id="menu-btn" type="button" aria-controls="menu" aria-expanded="false" aria-label="Все вопросы">
    <svg class="bf-ico-menu" width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><path d="M3 8h16M3 14h16" stroke="currentColor" stroke-width="1.8"/></svg>
    <svg class="bf-ico-close" width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><path d="M5 5l12 12M17 5 5 17" stroke="currentColor" stroke-width="1.8"/></svg>
  </button>

  <!-- Ловушка для ботов: человек это поле не видит и не заполняет. -->
  <label class="bf-trap" aria-hidden="true">Не заполняйте <input id="trap" type="text" tabindex="-1" autocomplete="off"></label>
</div>
<noscript><p class="bf-noscript">Для брифа нужен JavaScript. Включите его или напишите мне в Телеграм.</p></noscript>
<script src="data.js?v=3"></script>
<script src="brief.js?v=11"></script>
</body>
</html>
